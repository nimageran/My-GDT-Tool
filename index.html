<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD&T Professional Analyst</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden font-sans">

    <header class="bg-slate-900 text-white shrink-0 flex items-center gap-4 px-4 py-2 shadow-md z-40 relative">
        <button id="homeLogo" class="shrink-0 text-left" title="Start page">
            <h1 class="text-xl font-black tracking-wider text-yellow-500">ASME<span class="text-white">Y14.5</span></h1>
        </button>
        <button id="searchBtn" class="shrink-0 flex items-center gap-2 text-sm text-slate-300 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg pl-3 pr-2 py-1.5 transition-colors" title="Search everything (/ or Ctrl+K)">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span class="hidden 2xl:inline">Search</span>
            <kbd class="text-[11px] text-slate-400 border border-slate-600 rounded px-1.5 font-mono">/</kbd>
        </button>
        <!-- Units for every tool (js/units.js) -->
        <div id="unitsToggle" class="shrink-0 flex rounded-lg border border-slate-700 overflow-hidden text-xs font-bold" role="group" aria-label="Units" title="Units for every tool: mm or inch">
            <button data-u="mm" class="px-2.5 py-1.5 transition-colors">mm</button>
            <button data-u="in" class="px-2.5 py-1.5 transition-colors">inch</button>
        </div>
        <!-- Menu bar: each tab opens a drop-down of its tools (js/main.js) -->
        <nav id="categoryNav" role="menubar" class="flex items-center gap-0.5 ml-auto min-w-0 overflow-x-auto"></nav>
    </header>

    <!-- Where you are, and the previous / next tool in this tab -->
    <nav id="pathBar" class="bg-white border-b border-slate-200 px-4 h-10 flex items-center gap-2 text-sm shrink-0 z-30" aria-label="Current tool">
        <ol id="pathCrumbs" class="flex items-center gap-1.5 min-w-0 text-slate-500"></ol>
        <div class="ml-auto flex items-center gap-1 shrink-0">
            <button id="addNoteBtn" class="flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-blue-700 hover:bg-blue-50 border border-slate-200 rounded-md px-2.5 py-1" title="Write a note about what you are looking at (saved in My Notebook)"><i class="fa-solid fa-plus"></i> Note</button>
            <button id="notebookBtn" class="flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-blue-700 hover:bg-blue-50 rounded-md px-2.5 py-1 mr-2" title="Open My Notebook"><i class="fa-solid fa-book"></i> <span class="hidden md:inline">Notebook</span></button>
            <span id="pathCount" class="text-xs text-slate-400 mr-1"></span>
            <button id="prevTool" class="w-8 h-8 rounded hover:bg-slate-100 text-slate-500 disabled:opacity-30" title="Previous tool in this tab"><i class="fa-solid fa-chevron-left"></i></button>
            <button id="nextTool" class="w-8 h-8 rounded hover:bg-slate-100 text-slate-500 disabled:opacity-30" title="Next tool in this tab"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </nav>

    <div class="flex-1 flex overflow-hidden relative">
        
        <section id="controlsPanel" class="w-[26rem] bg-white border-r border-slate-200 flex flex-col z-20 relative shadow-[4px_0_24px_rgba(0,0,0,0.02)] transition-all duration-300 ease-in-out">
            
            <div class="p-4 border-b border-slate-100 bg-slate-50/50 shrink-0 flex items-center justify-between">
                <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm uppercase tracking-wide">
                    <i class="fa-solid fa-sliders text-blue-500"></i> 
                    Controls
                </h3>
                <div class="flex items-center gap-3">
                    <button id="explainBtn" class="hidden text-xs font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-full px-3 py-1 flex items-center gap-1.5" title="Explain this tool in simple words">
                        <i class="fa-solid fa-circle-question"></i> Explain
                    </button>
                    <button id="toggleControlsBtn" class="text-slate-400 hover:text-blue-600 transition-colors" title="Collapse Panel">
                        <i class="fa-solid fa-angles-left"></i>
                    </button>
                </div>
            </div>
            
            <div id="controlsContent" class="flex-1 overflow-y-auto p-4 space-y-6 bg-slate-50/30">
                <p class="text-slate-400 italic text-sm mt-4">Loading…</p>
            </div>
        </section>

        <main class="flex-1 flex flex-col bg-slate-100 relative overflow-hidden">
             <button id="expandControlsBtn" class="absolute top-4 left-4 z-50 bg-white p-2 rounded shadow border border-slate-200 text-slate-600 hover:text-blue-600 hidden">
                <i class="fa-solid fa-sliders"></i>
             </button>

             <div id="canvas-container" class="flex-1 relative blueprint-grid overflow-hidden flex items-center justify-center shadow-inner">
                <svg id="mainCanvas" viewBox="0 0 1000 800" class="w-full h-full"></svg>
            </div>
        </main>

    </div>

    <!-- three.js for the 3D tools; only downloaded when a 3D tool is opened -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
